name: stockparfum
description: "Application mobile de gestion de stock pour boutique de parfums, Antares, déodorants et soins du visage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gestion d'état
  provider: ^6.1.2

  # Réseau / API REST
  http: ^1.2.1

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Sélection et upload d'image produit
  image_picker: ^1.1.2

  # Formatage des dates et des montants
  intl: ^0.19.0

  # Icônes modernes
  font_awesome_flutter: ^10.7.0

  # Cache / affichage réseau des images produits
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
